# Celebright dashboard template. The `celebright.generate_dashboard` service fills in your
# controller's device id and writes celebright_dashboard.yaml; regenerate after updating
# instead of editing it. The same three screens are on the sidebar page (Settings →
# Devices & services → Celebright → Configure → Show Celebright in the sidebar).
title: Celebright
views:
  # --- 1. Control: power, colour, scenes with previews, and the schedule ---
  - title: Control
    path: celebright-card
    type: panel   # one full-width card; the default masonry layout squeezes it into a column
    icon: mdi:lightbulb-group
    cards:
      - type: vertical-stack
        cards:
          - type: custom:celebright-card
            device: "__DEVICE_ID__"
          - type: button
            name: Regenerate this dashboard
            icon: mdi:file-refresh
            tap_action:
              action: perform-action
              perform_action: celebright.generate_dashboard
              data:
                device_id: "__DEVICE_ID__"
              confirmation:
                text: Rewrite celebright_dashboard.yaml? Edits you made to it are lost. Refresh the page afterwards.

  # --- 2. Holidays: a scene per holiday, kept on the controller ---
  - title: Holidays
    path: holidays
    type: panel
    icon: mdi:calendar-star
    cards:
      - type: custom:celebright-holidays-card
        device: "__DEVICE_ID__"

  # --- 3. Rules: show a scene while something is true (aurora, a switch, a sensor) ---
  - title: Rules
    path: rules
    type: panel
    icon: mdi:weather-night
    cards:
      - type: custom:celebright-rules-card
        device: "__DEVICE_ID__"
