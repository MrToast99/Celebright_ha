blueprint:
  name: Celebright scene on a toggle
  description: >
    Shows a scene while a toggle (input_boolean) is on, and hands control back to the
    schedule when it turns off.
  domain: automation
  author: MrToast99
  source_url: https://github.com/MrToast99/Celebright_ha/blob/main/blueprints/automation/celebright/scene_toggle.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    toggle:
      name: Toggle
      description: An input_boolean helper.
      selector:
        entity:
          filter:
            - domain: input_boolean
    scene_select:
      name: Scene selector
      description: Your controller's scene dropdown (used to resume the schedule).
      selector:
        entity:
          filter:
            - domain: select
              integration: celebright
    scene:
      name: Scene
      description: The scene to show while the toggle is on.
      selector:
        entity:
          filter:
            - domain: scene
              integration: celebright

mode: single

triggers:
  - trigger: state
    entity_id: !input toggle
    to:
      - "on"
      - "off"

actions:
  - choose:
      - alias: Toggle on - show the scene
        conditions: "{{ trigger.to_state.state == 'on' }}"
        sequence:
          - action: scene.turn_on
            target:
              entity_id: !input scene
    default:
      - alias: Toggle off - resume the schedule
        action: select.select_option
        target:
          entity_id: !input scene_select
        data:
          option: "Off"
