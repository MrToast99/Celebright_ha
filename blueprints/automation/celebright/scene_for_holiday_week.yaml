blueprint:
  name: Celebright scene for a holiday week
  description: >
    Shows a scene from sunset to sunrise on every night of the Monday-Sunday week that
    contains a date (e.g. July 1), every year.
  domain: automation
  author: MrToast99
  source_url: https://github.com/MrToast99/Celebright_ha/blob/main/blueprints/automation/celebright/scene_for_holiday_week.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    scene_select:
      name: Scene selector
      description: Your controller's scene dropdown.
      selector:
        entity:
          filter:
            - domain: select
              integration: celebright
    scene:
      name: Scene
      description: Scene name exactly as in the dropdown.
      selector:
        text:
    month:
      name: Holiday month
      default: 7
      selector:
        number:
          min: 1
          max: 12
          mode: box
    day:
      name: Holiday day
      default: 1
      selector:
        number:
          min: 1
          max: 31
          mode: box
    off_option:
      name: Resume-schedule option
      description: The dropdown option that hands control back to the schedule.
      default: "Off"
      selector:
        text:

mode: single

variables:
  scene_select: !input scene_select
  scene: !input scene
  off_option: !input off_option
  month: !input month
  day: !input day
  in_week: "{{ now().isocalendar()[1] == now().replace(month=month | int, day=day | int).isocalendar()[1] }}"

triggers:
  - trigger: sun
    event: sunset
    id: dusk
  - trigger: sun
    event: sunrise
    id: dawn

actions:
  - choose:
      - conditions: "{{ trigger.id == 'dusk' and in_week }}"
        sequence:
          - action: select.select_option
            target:
              entity_id: !input scene_select
            data:
              option: "{{ scene }}"
      # Sunrise: only if our scene is showing, so it also ends a night that spans into the next week.
      - conditions: "{{ trigger.id == 'dawn' and is_state(scene_select, scene) }}"
        sequence:
          - action: select.select_option
            target:
              entity_id: !input scene_select
            data:
              option: "{{ off_option }}"
