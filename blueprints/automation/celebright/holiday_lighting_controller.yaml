blueprint:
  name: Celebright holiday lighting controller
  description: >
    One automation for all scheduled lighting. Every trigger re-evaluates the date and
    time and applies the highest-priority matching scene: New Year fireworks, an aurora
    alert, up to four custom holidays of your own, Halloween, December, then the week-long
    holidays. Otherwise, and in daylight, the controller's own schedule takes over. Leave a
    scene empty to skip that holiday. Holidays apply by calendar date (a night ends at midnight).
  domain: automation
  author: MrToast99
  source_url: https://github.com/MrToast99/Celebright_ha/blob/main/blueprints/automation/celebright/holiday_lighting_controller.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    controller:
      name: Controller
      icon: mdi:string-lights
      input:
        scene_select:
          name: Scene selector
          description: Your controller's scene dropdown (used to resume the schedule).
          selector:
            entity:
              filter:
                - domain: select
                  integration: celebright
    aurora:
      name: Aurora alert
      icon: mdi:weather-night
      collapsed: true
      input:
        aurora_sensor:
          name: Aurora visibility sensor
          description: Optional. Leave empty to ignore aurora.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
        aurora_threshold:
          name: Aurora threshold
          description: Show the aurora scene above this value.
          default: 75
          selector:
            number:
              min: 0
              max: 100
              mode: box
        aurora_scene:
          name: Aurora scene
          description: Optional. The scene to show.
          default: ""
          selector:
            entity:
              filter:
                - domain: scene
                  integration: celebright
    holidays:
      name: Holiday scenes
      icon: mdi:calendar-star
      description: Pick a scene for each holiday. Leave one empty to skip it.
      input:
        new_year_scene:
          name: New Year fireworks (Jan 1, 00:00–00:15)
          default: ""
          selector:
            entity:
              filter:
                - domain: scene
                  integration: celebright
        december_scene:
          name: December (whole month)
          default: ""
          selector:
            entity:
              filter:
                - domain: scene
                  integration: celebright
        st_patricks_scene:
          name: St. Patrick's Day week (Mar 17)
          default: ""
          selector:
            entity:
              filter:
                - domain: scene
                  integration: celebright
        canada_day_scene:
          name: Canada Day week (Jul 1)
          default: ""
          selector:
            entity:
              filter:
                - domain: scene
                  integration: celebright
        thanksgiving_scene:
          name: Canadian Thanksgiving week (2nd Monday of October)
          default: ""
          selector:
            entity:
              filter:
                - domain: scene
                  integration: celebright
        halloween_scene:
          name: Halloween (Oct 25–31)
          default: ""
          selector:
            entity:
              filter:
                - domain: scene
                  integration: celebright
        remembrance_scene:
          name: Remembrance Day week (Nov 11)
          default: ""
          selector:
            entity:
              filter:
                - domain: scene
                  integration: celebright
        easter_scene:
          name: Easter Monday week
          default: ""
          selector:
            entity:
              filter:
                - domain: scene
                  integration: celebright
        truth_reconciliation_scene:
          name: National Day for Truth and Reconciliation week (Sep 30)
          default: ""
          selector:
            entity:
              filter:
                - domain: scene
                  integration: celebright
    timing:
      name: Adjust holiday timing
      icon: mdi:calendar-clock
      collapsed: true
      description: >
        Optional. A week-long holiday runs Monday to Sunday around its date; extend it by whole
        days before or after that week. To shorten a holiday or move it elsewhere, leave its
        scene empty and use a custom holiday instead.
      input:
        st_patricks_before:
          name: St. Patrick's Day, extra days before
          default: 0
          selector:
            number:
              min: 0
              max: 14
              mode: box
        st_patricks_after:
          name: St. Patrick's Day, extra days after
          default: 0
          selector:
            number:
              min: 0
              max: 14
              mode: box
        canada_day_before:
          name: Canada Day, extra days before
          default: 0
          selector:
            number:
              min: 0
              max: 14
              mode: box
        canada_day_after:
          name: Canada Day, extra days after
          default: 0
          selector:
            number:
              min: 0
              max: 14
              mode: box
        thanksgiving_before:
          name: Canadian Thanksgiving, extra days before
          default: 0
          selector:
            number:
              min: 0
              max: 14
              mode: box
        thanksgiving_after:
          name: Canadian Thanksgiving, extra days after
          default: 0
          selector:
            number:
              min: 0
              max: 14
              mode: box
        remembrance_before:
          name: Remembrance Day, extra days before
          default: 0
          selector:
            number:
              min: 0
              max: 14
              mode: box
        remembrance_after:
          name: Remembrance Day, extra days after
          default: 0
          selector:
            number:
              min: 0
              max: 14
              mode: box
        easter_before:
          name: Easter Monday, extra days before
          default: 0
          selector:
            number:
              min: 0
              max: 14
              mode: box
        easter_after:
          name: Easter Monday, extra days after
          default: 0
          selector:
            number:
              min: 0
              max: 14
              mode: box
        truth_reconciliation_before:
          name: Truth and Reconciliation, extra days before
          default: 0
          selector:
            number:
              min: 0
              max: 14
              mode: box
        truth_reconciliation_after:
          name: Truth and Reconciliation, extra days after
          default: 0
          selector:
            number:
              min: 0
              max: 14
              mode: box
        halloween_start_day:
          name: Halloween, first day (October)
          default: 25
          selector:
            number:
              min: 1
              max: 31
              mode: box
        halloween_end_day:
          name: Halloween, last day (October)
          default: 31
          selector:
            number:
              min: 1
              max: 31
              mode: box
    custom_1:
      name: Custom holiday 1
      icon: mdi:calendar-plus
      collapsed: true
      description: Your own holiday, every year. The dates are inclusive and may cross New Year (e.g. Dec 20 to Jan 5).
      input:
        custom_1_scene:
          name: Scene
          default: ""
          selector:
            entity:
              filter:
                - domain: scene
                  integration: celebright
        custom_1_start_month:
          name: Start month
          default: 1
          selector:
            number:
              min: 1
              max: 12
              mode: box
        custom_1_start_day:
          name: Start day
          default: 1
          selector:
            number:
              min: 1
              max: 31
              mode: box
        custom_1_end_month:
          name: End month
          default: 1
          selector:
            number:
              min: 1
              max: 12
              mode: box
        custom_1_end_day:
          name: End day
          default: 1
          selector:
            number:
              min: 1
              max: 31
              mode: box
    custom_2:
      name: Custom holiday 2
      icon: mdi:calendar-plus
      collapsed: true
      description: Your own holiday, every year. The dates are inclusive and may cross New Year (e.g. Dec 20 to Jan 5).
      input:
        custom_2_scene:
          name: Scene
          default: ""
          selector:
            entity:
              filter:
                - domain: scene
