mode: restart

trigger_variables:
  aurora_sensor: !input aurora_sensor
  aurora_threshold: !input aurora_threshold

variables:
  scene_select: !input scene_select
  aurora_sensor: !input aurora_sensor
  aurora_threshold: !input aurora_threshold
  aurora_scene: !input aurora_scene
  new_year_scene: !input new_year_scene
  december_scene: !input december_scene
  st_patricks_scene: !input st_patricks_scene
  canada_day_scene: !input canada_day_scene
  thanksgiving_scene: !input thanksgiving_scene
  remembrance_scene: !input remembrance_scene
  easter_scene: !input easter_scene
  halloween_scene: !input halloween_scene
  truth_reconciliation_scene: !input truth_reconciliation_scene
  st_patricks_before: !input st_patricks_before
  st_patricks_after: !input st_patricks_after
  canada_day_before: !input canada_day_before
  canada_day_after: !input canada_day_after
  thanksgiving_before: !input thanksgiving_before
  thanksgiving_after: !input thanksgiving_after
  remembrance_before: !input remembrance_before
  remembrance_after: !input remembrance_after
  easter_before: !input easter_before
  easter_after: !input easter_after
  truth_reconciliation_before: !input truth_reconciliation_before
  truth_reconciliation_after: !input truth_reconciliation_after
  halloween_start_day: !input halloween_start_day
  halloween_end_day: !input halloween_end_day
  custom_1_scene: !input custom_1_scene
  custom_1_start_month: !input custom_1_start_month
  custom_1_start_day: !input custom_1_start_day
  custom_1_end_month: !input custom_1_end_month
  custom_1_end_day: !input custom_1_end_day
  custom_2_scene: !input custom_2_scene
  custom_2_start_month: !input custom_2_start_month
  custom_2_start_day: !input custom_2_start_day
  custom_2_end_month: !input custom_2_end_month
  custom_2_end_day: !input custom_2_end_day
  custom_3_scene: !input custom_3_scene
  custom_3_start_month: !input custom_3_start_month
  custom_3_start_day: !input custom_3_start_day
  custom_3_end_month: !input custom_3_end_month
  custom_3_end_day: !input custom_3_end_day
  custom_4_scene: !input custom_4_scene
  custom_4_start_month: !input custom_4_start_month
  custom_4_start_day: !input custom_4_start_day
  custom_4_end_month: !input custom_4_end_month
  custom_4_end_day: !input custom_4_end_day
  # A week-long holiday applies on every day of the Mon-Sun week containing its date,
  # widened by the optional extra days before/after.
  in_st_patricks: >-
    {%- set a = now().replace(month=3, day=17) -%}
    {%- set ws = a - timedelta(days=a.weekday() + st_patricks_before | int) -%}
    {%- set we = a + timedelta(days=6 - a.weekday() + st_patricks_after | int) -%}
    {{ ws.date() <= now().date() <= we.date() }}
  in_canada_day: >-
    {%- set a = now().replace(month=7, day=1) -%}
    {%- set ws = a - timedelta(days=a.weekday() + canada_day_before | int) -%}
    {%- set we = a + timedelta(days=6 - a.weekday() + canada_day_after | int) -%}
    {{ ws.date() <= now().date() <= we.date() }}
  in_remembrance: >-
    {%- set a = now().replace(month=11, day=11) -%}
    {%- set ws = a - timedelta(days=a.weekday() + remembrance_before | int) -%}
    {%- set we = a + timedelta(days=6 - a.weekday() + remembrance_after | int) -%}
    {{ ws.date() <= now().date() <= we.date() }}
  in_truth_reconciliation: >-
    {%- set a = now().replace(month=9, day=30) -%}
    {%- set ws = a - timedelta(days=a.weekday() + truth_reconciliation_before | int) -%}
    {%- set we = a + timedelta(days=6 - a.weekday() + truth_reconciliation_after | int) -%}
    {{ ws.date() <= now().date() <= we.date() }}
  # Canadian Thanksgiving: 2nd Monday of October.
  in_thanksgiving: >-
    {%- set oct1 = now().replace(month=10, day=1) -%}
    {%- set first_mon = 1 + (7 - oct1.weekday()) % 7 -%}
    {%- set a = now().replace(month=10, day=first_mon + 7) -%}
    {%- set ws = a - timedelta(days=a.weekday() + thanksgiving_before | int) -%}
    {%- set we = a + timedelta(days=6 - a.weekday() + thanksgiving_after | int) -%}
    {{ ws.date() <= now().date() <= we.date() }}
  # Easter Monday (Gregorian computus, +1 day).
  in_easter: >-
    {%- set y = now().year -%}
    {%- set a = y % 19 -%}
    {%- set b = y // 100 -%}
    {%- set c = y % 100 -%}
    {%- set d = b // 4 -%}
    {%- set e = b % 4 -%}
    {%- set f = (b + 8) // 25 -%}
    {%- set g = (b - f + 1) // 3 -%}
    {%- set h = (19*a + b - d - g + 15) % 30 -%}
    {%- set i = c // 4 -%}
    {%- set k = c % 4 -%}
    {%- set l = (32 + 2*e + 2*i - h - k) % 7 -%}
    {%- set m = (a + 11*h + 22*l) // 451 -%}
    {%- set mon = (h + l - 7*m + 114) // 31 -%}
    {%- set day = ((h + l - 7*m + 114) % 31) + 1 -%}
    {%- set emonday = now().replace(month=mon, day=day, hour=12, minute=0, second=0, microsecond=0) + timedelta(days=1) -%}
    {%- set ws = emonday - timedelta(days=emonday.weekday() + easter_before | int) -%}
    {%- set we = emonday + timedelta(days=6 - emonday.weekday() + easter_after | int) -%}
    {{ ws.date() <= now().date() <= we.date() }}
  in_halloween: "{{ now().month == 10 and halloween_start_day | int <= now().day <= halloween_end_day | int }}"
  # Custom holidays: an inclusive date range that may cross New Year.
  in_custom_1: >-
    {%- set md = now().month * 100 + now().day -%}
    {%- set s = custom_1_start_month | int * 100 + custom_1_start_day | int -%}
    {%- set e = custom_1_end_month | int * 100 + custom_1_end_day | int -%}
    {{ (s <= md <= e) if s <= e else (md >= s or md <= e) }}
  in_custom_2: >-
    {%- set md = now().month * 100 + now().day -%}
    {%- set s = custom_2_start_month | int * 100 + custom_2_start_day | int -%}
    {%- set e = custom_2_end_month | int * 100 + custom_2_end_day | int -%}
    {{ (s <= md <= e) if s <= e else (md >= s or md <= e) }}
  in_custom_3: >-
    {%- set md = now().month * 100 + now().day -%}
    {%- set s = custom_3_start_month | int * 100 + custom_3_start_day | int -%}
    {%- set e = custom_3_end_month | int * 100 + custom_3_end_day | int -%}
    {{ (s <= md <= e) if s <= e else (md >= s or md <= e) }}
  in_custom_4: >-
    {%- set md = now().month * 100 + now().day -%}
    {%- set s = custom_4_start_month | int * 100 + custom_4_start_day | int -%}
    {%- set e = custom_4_end_month | int * 100 + custom_4_end_day | int -%}
    {{ (s <= md <= e) if s <= e else (md >= s or md <= e) }}
  aurora_active: "{{ aurora_sensor != '' and states(aurora_sensor) | float(0) > aurora_threshold | float(0) }}"
  new_year_window: "{{ now().month == 1 and now().day == 1 and now().hour == 0 and now().minute < 15 }}"

triggers:
  - trigger: sun
    alias: Sunset
    event: sunset
    id: dusk
  - trigger: sun
    alias: Sunrise
    event: sunrise
    id: dawn
  - trigger: time
    alias: Midnight
    at: "00:00:00"
  - trigger: time
    alias: 00:15 (end of the New Year window)
    at: "00:15:00"
  - trigger: time_pattern
    alias: Every 30 minutes
    minutes: "/30"
  - trigger: template
    alias: Aurora rises above the threshold
    value_template: "{{ aurora_sensor != '' and states(aurora_sensor) | float(0) > aurora_threshold | float(0) }}"
  - trigger: template
    alias: Aurora falls to the threshold or below
    value_template: "{{ aurora_sensor != '' and states(aurora_sensor) | float(0) <= aurora_threshold | float(0) }}"

actions:
  - alias: Apply the highest-priority matching scene
    choose:
      # Daytime / sunrise: hand back to the controller's schedule. The dusk trigger is
      # excluded: right at sunset sun.sun can still read "above_horizon".
      - alias: Daytime or sunrise - resume the schedule
        conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: dawn
              - condition: and
                conditions:
                  - condition: not
                    conditions:
                      - condition: trigger
                        id: dusk
                  - condition: state
                    entity_id: sun.sun
                    state: above_horizon
        sequence:
          - action: select.select_option
            target:
              entity_id: !input scene_select
            data:
              option: "Off"

      # Night: the first matching rule wins (highest priority first).
      - alias: New Year fireworks
        conditions: "{{ new_year_scene != '' and new_year_window }}"
        sequence:
          - action: scene.turn_on
            target:
              entity_id: "{{ new_year_scene }}"
      - alias: Aurora alert
        conditions: "{{ aurora_scene != '' and aurora_active }}"
        sequence:
          - action: scene.turn_on
            target:
              entity_id: "{{ aurora_scene }}"
      - alias: Custom holiday 1
        conditions: "{{ custom_1_scene != '' and in_custom_1 }}"
        sequence:
          - action: scene.turn_on
            target:
              entity_id: "{{ custom_1_scene }}"
      - alias: Custom holiday 2
        conditions: "{{ custom_2_scene != '' and in_custom_2 }}"
        sequence:
          - action: scene.turn_on
            target:
              entity_id: "{{ custom_2_scene }}"
      - alias: Custom holiday 3
        conditions: "{{ custom_3_scene != '' and in_custom_3 }}"
        sequence:
          - action: scene.turn_on
            target:
              entity_id: "{{ custom_3_scene }}"
      - alias: Custom holiday 4
        conditions: "{{ custom_4_scene != '' and in_custom_4 }}"
        sequence:
          - action: scene.turn_on
            target:
              entity_id: "{{ custom_4_scene }}"
      - alias: Halloween
        conditions: "{{ halloween_scene != '' and in_halloween }}"
        sequence:
          - action: scene.turn_on
            target:
              entity_id: "{{ halloween_scene }}"
      - alias: December
        conditions: "{{ december_scene != '' and now().month == 12 }}"
        sequence:
          - action: scene.turn_on
            target:
              entity_id: "{{ december_scene }}"
      - alias: St. Patrick's Day week
        conditions: "{{ st_patricks_scene != '' and in_st_patricks }}"
        sequence:
          - action: scene.turn_on
            target:
              entity_id: "{{ st_patricks_scene }}"
      - alias: Canada Day week
        conditions: "{{ canada_day_scene != '' and in_canada_day }}"
        sequence:
          - action: scene.turn_on
            target:
              entity_id: "{{ canada_day_scene }}"
      - alias: Canadian Thanksgiving week
        conditions: "{{ thanksgiving_scene != '' and in_thanksgiving }}"
        sequence:
          - action: scene.turn_on
            target:
              entity_id: "{{ thanksgiving_scene }}"
      - alias: Remembrance Day week
        conditions: "{{ remembrance_scene != '' and in_remembrance }}"
        sequence:
          - action: scene.turn_on
            target:
              entity_id: "{{ remembrance_scene }}"
      - alias: Easter Monday week
        conditions: "{{ easter_scene != '' and in_easter }}"
        sequence:
          - action: scene.turn_on
            target:
              entity_id: "{{ easter_scene }}"
      - alias: Truth and Reconciliation week
        conditions: "{{ truth_reconciliation_scene != '' and in_truth_reconciliation }}"
        sequence:
          - action: scene.turn_on
            target:
              entity_id: "{{ truth_reconciliation_scene }}"
    # Night with no holiday active: hand back to the schedule.
    default:
      - action: select.select_option
        target:
          entity_id: !input scene_select
        data:
          option: "Off"
