              mode: box
    custom_3:
      name: Custom holiday 3
      icon: mdi:calendar-plus
      collapsed: true
      description: Your own holiday, every year. The dates are inclusive and may cross New Year (e.g. Dec 20 to Jan 5).
      input:
        custom_3_scene:
          name: Scene
          default: ""
          selector:
            entity:
              filter:
                - domain: scene
                  integration: celebright
        custom_3_start_month:
          name: Start month
